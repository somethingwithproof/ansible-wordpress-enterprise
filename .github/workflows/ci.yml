---
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

# Cancel previous runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15  # Prevent hung jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock

      - name: Run yamllint
        run: yamllint .

      - name: Link role for ansible-lint
        run: |
          mkdir -p .ansible/roles
          ln -s "$GITHUB_WORKSPACE" .ansible/roles/ansible-wordpress-enterprise

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run unit tests
        run: pytest tests/unit -q

  molecule-test:
    name: Molecule Test (Ubuntu 24/Nginx and Rocky 9/Apache)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45  # Full multi-platform converge and idempotence takes over 20 minutes
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Molecule and dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Run stable Molecule contract
        run: molecule test --scenario-name default
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

  release:
    name: Release
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15  # Prevent hung jobs
    needs: [molecule-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock

      - name: Get version from meta
        id: get_version
        run: |
          role_version=$(awk '/version:/ {gsub(/"/, "", $2); print $2; exit}' meta/main.yml)
          echo "version=${role_version}" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        env:
          ROLE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if git rev-parse "v${ROLE_VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Ansible Galaxy
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          ansible-galaxy role import --api-key "$GALAXY_API_KEY" thomasvincent wordpress_enterprise
        continue-on-error: true
