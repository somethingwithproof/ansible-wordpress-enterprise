---
name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

# Cancel previous runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # Prevent hung jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock

      - name: Run yamllint
        run: yamllint .

      - name: Link role for ansible-lint
        run: |
          mkdir -p .ansible/roles
          ln -s "$GITHUB_WORKSPACE" .ansible/roles/ansible-wordpress-enterprise
          ln -s "$GITHUB_WORKSPACE" .ansible/roles/thomasvincent.wordpress_enterprise

      - name: Run ansible-lint
        run: ansible-lint

      - name: Verify SPDX license coverage
        run: python scripts/check_spdx.py

      - name: Run unit tests
        run: pytest tests/unit -q

  molecule-test:
    name: Molecule Test (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        scenario: [default, tls, lts, lts-tls]
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # Full multi-platform converge and idempotence takes over 20 minutes
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Molecule and dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Run stable Molecule contract
        run: molecule test --scenario-name "${{ matrix.scenario }}"
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'


  native-artifacts:
    name: Build and install release packages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.1
          install: false
          cache: false
      - name: Install pinned release tools
        run: |
          mise install nfpm@2.47.0
          python -m pip install --only-binary=:all: --require-hashes -r packaging/build-requirements.txt
      - name: Build project and native artifacts
        id: version
        run: mise exec nfpm@2.47.0 -- python scripts/release_artifacts.py build
      - name: Install, exercise and remove Debian and RPM packages
        run: python scripts/smoke_native_packages.py "dist/release/${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/release/${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          retention-days: 14
