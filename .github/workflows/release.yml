---
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run Molecule tests
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

  release:
    name: Create Release
    runs-on: [self-hosted, linux, x64]
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          if PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null); then
            CHANGELOG=$(git log --pretty=format:"- %s" "$PREVIOUS_TAG..HEAD")
          else
            CHANGELOG=$(git log --pretty=format:"- %s")
          fi
          DELIMITER="changelog_$(openssl rand -hex 16)"
          {
            echo "changelog<<$DELIMITER"
            echo "$CHANGELOG"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## Release v${{ steps.version.outputs.version }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Installation

            ```bash
            ansible-galaxy install thomasvincent.wordpress_enterprise,v${{ steps.version.outputs.version }}
            ```

            Or from GitHub:

            ```bash
            ansible-galaxy install git+https://github.com/${{ github.repository }}.git,v${{ steps.version.outputs.version }}
            ```

            ### Quick Start

            ```yaml
            - name: Deploy WordPress
              hosts: wordpress_servers
              become: true
              roles:
                - role: thomasvincent.wordpress_enterprise
                  vars:
                    wordpress_site_url: "https://example.com"
                    wordpress_site_title: "My WordPress Site"
                    wordpress_admin_user: "admin"
                    wordpress_admin_email: "admin@example.com"
            ```

            ### Documentation

            Full documentation is available in the [README.md](README.md)

            ### Examples

            Check out the `examples/` directory for cloud-specific configurations:
            - AWS
            - Google Cloud Platform
            - Microsoft Azure
            - DigitalOcean
            - Cloudflare
            - Oracle Cloud
            - Multi-cloud HA
          draft: false
          prerelease: false

  publish-galaxy:
    name: Publish to Ansible Galaxy
    runs-on: [self-hosted, linux, x64]
    needs: [test, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Ansible
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock

      - name: Publish to Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          ansible-galaxy role import --api-key="$GALAXY_API_KEY" thomasvincent ansible-wordpress-enterprise
        continue-on-error: true
