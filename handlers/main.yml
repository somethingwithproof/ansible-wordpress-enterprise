# Security-related handlers
- name: reload apparmor
  ansible.builtin.systemd:
    name: apparmor
    state: reloaded
  become: true
  when: ansible_os_family == "Debian"

- name: restart auditd
  ansible.builtin.systemd:
    name: auditd
    state: restarted
  become: true

- name: restart dnf-automatic timer
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    state: restarted
    enabled: true
  become: true
  when: ansible_os_family == "RedHat"

- name: reboot system
  ansible.builtin.reboot:
    reboot_timeout: 600
    test_command: whoami
  become: true
  when: wordpress_allow_reboot | default(false)

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  become: true
  changed_when: false

- name: Restart sshd
  ansible.builtin.systemd:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: restarted
  become: true

# Runs as the web user so the flush touches the same cache the site writes.
- name: Run wp-cli cache flush
  ansible.builtin.command:
    cmd: "{{ wordpress_wpcli_bin }} cache flush --path={{ wordpress_install_dir }}"
  become: true
  become_user: "{{ wordpress_system_user }}"
  register: wordpress_cache_flush
  changed_when: wordpress_cache_flush.rc == 0
  # Best effort: the config can change before WordPress is installed, and a
  # cold cache is not a deployment failure. Report it rather than hide it.
  failed_when: false

- name: Report a failed wp-cli cache flush
  ansible.builtin.debug:
    msg: "wp cache flush exited {{ wordpress_cache_flush.rc }}: {{ wordpress_cache_flush.stderr | default('') }}"
  when: wordpress_cache_flush.rc | default(0) != 0

# Only handlers/main.yml is auto-loaded for a role, so anything defined in
# handlers/security.yml never resolves; this is the one it alone carried.
- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  become: true
