---
# Handlers for ansible-wordpress-enterprise.
#
# Service names differ between distributions, so they come from
# vars/<os_family>.yml rather than being written out here.

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart php-fpm
  ansible.builtin.systemd:
    name: "{{ wordpress_php_fpm_service }}"
    state: restarted
    daemon_reload: true
  become: true

- name: Reload nginx
  ansible.builtin.systemd:
    name: "{{ wordpress_web_server_service['nginx'] }}"
    state: reloaded
  become: true

- name: Restart nginx
  ansible.builtin.systemd:
    name: "{{ wordpress_web_server_service['nginx'] }}"
    state: restarted
  become: true

- name: Reload apache
  ansible.builtin.systemd:
    name: "{{ wordpress_web_server_service['apache'] }}"
    state: reloaded
  become: true

- name: Restart apache
  ansible.builtin.systemd:
    name: "{{ wordpress_web_server_service['apache'] }}"
    state: restarted
  become: true

- name: Restart mysql
  ansible.builtin.systemd:
    name: "{{ wordpress_db_service['mysql'] }}"
    state: restarted
  become: true

- name: Restart mariadb
  ansible.builtin.systemd:
    name: "{{ wordpress_db_service['mariadb'] }}"
    state: restarted
  become: true

- name: Restart redis
  ansible.builtin.systemd:
    name: "{{ wordpress_redis_service }}"
    state: restarted
  become: true

- name: Restart memcached
  ansible.builtin.systemd:
    name: memcached
    state: restarted
  become: true

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  become: true

- name: Restart sshd
  ansible.builtin.systemd:
    name: "{{ wordpress_sshd_service }}"
    state: restarted
  become: true

- name: Restart auditd
  ansible.builtin.systemd:
    name: auditd
    state: restarted
  become: true
  changed_when: false

- name: Reload apparmor
  ansible.builtin.systemd:
    name: apparmor
    state: reloaded
  become: true
  when: ansible_facts.os_family == "Debian"

- name: Restart dnf-automatic timer
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    state: restarted
    enabled: true
  become: true
  when: ansible_facts.os_family == "RedHat"

- name: Compile the custom SELinux policy
  ansible.builtin.shell: |
    set -e
    cd /etc/selinux/local
    checkmodule -M -m -o wordpress_custom.mod wordpress_custom.te
    semodule_package -o wordpress_custom.pp -m wordpress_custom.mod
    semodule -i wordpress_custom.pp
  become: true
  changed_when: true

# Runs as the web user so the flush touches the same cache the site writes.
- name: Run wp-cli cache flush
  ansible.builtin.command:
    cmd: "{{ wordpress_wpcli_bin }} cache flush --path={{ wordpress_install_dir }}"
  become: true
  become_user: "{{ wordpress_system_user }}"
  register: wordpress_cache_flush
  changed_when: wordpress_cache_flush.rc == 0
  # Best effort: the config can change before WordPress is installed, and a
  # cold cache is not a deployment failure. Report it rather than hide it.
  failed_when: false
  notify: Report a failed wp-cli cache flush

- name: Report a failed wp-cli cache flush
  ansible.builtin.debug:
    msg: "wp cache flush exited {{ wordpress_cache_flush.rc }}: {{ wordpress_cache_flush.stderr | default('') }}"
  when: wordpress_cache_flush.rc | default(0) != 0

- name: Reboot system
  ansible.builtin.reboot:
    reboot_timeout: 600
    test_command: whoami
  become: true
  when: wordpress_allow_reboot | default(false)
