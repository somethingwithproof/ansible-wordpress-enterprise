---
# Release support policy for this role.
#
# The rule: a distribution is supported only while its vendor still gives it
# FULL support, and only while a Molecule scenario exercises it. Extended
# phases do not count. tests/unit/test_platform_support.py enforces both, so
# this file is the single source of truth for meta/main.yml and the Molecule
# matrix, and the suite starts failing the day a supported release leaves full
# support.
#
# "Full support" is a different vendor phase in each family, so the date below
# comes from a different endoflife.date field for each:
#
#   EL      Full Support, before Maintenance Support   -> "support"
#   Ubuntu  standard security maintenance, before ESM  -> "eol"
#   Debian  regular support, before LTS                -> "eol"
#
# Dates checked 2026-08-25 against https://endoflife.date.
#
# Runtime validation consumes runtime_platforms and php_versions below.  The
# unit suite keeps those gates aligned with the supported distribution records,
# Galaxy metadata and Molecule.  A release is never supported merely because
# it belongs to a compatible OS family.
#
# To adopt a new OS release: prove it with the full Molecule contract, then add
# its runtime identity, set supported to true and update meta/main.yml together.
runtime_platforms:
  Ubuntu:
    - "24.04"
  RedHat:
    - "9"
  Rocky:
    - "9"
  AlmaLinux:
    - "9"

ansible_core:
  release_line: "2.21"
  minimum_version: "2.21.4"
  next_release: "2.22.0"

ansible_package:
  release_line: "14"
  minimum_version: "14.4.0"
  next_release: "15.0.0"

distributions:
  - meta_name: EL
    meta_version: "8"
    image: geerlingguy/docker-rockylinux8-ansible
    full_support_ends: "2024-05-31"
    supported: false  # maintenance only since 2024-05-31

  - meta_name: EL
    meta_version: "9"
    image: geerlingguy/docker-rockylinux9-ansible
    full_support_ends: "2027-05-31"
    supported: true
    release_channel: lts
    runtime_distributions: [RedHat, Rocky, AlmaLinux]
    runtime_release: "9"

  - meta_name: EL
    meta_version: "10"
    image: geerlingguy/docker-rockylinux10-ansible
    full_support_ends: "2030-05-31"
    supported: false  # not yet adopted; no verified run

  - meta_name: Ubuntu
    meta_version: focal
    image: geerlingguy/docker-ubuntu2004-ansible
    full_support_ends: "2025-05-31"
    supported: false  # ESM only since 2025-05-31

  - meta_name: Ubuntu
    meta_version: jammy
    image: geerlingguy/docker-ubuntu2204-ansible
    full_support_ends: "2027-04-01"
    supported: false  # compatibility target; not in the stable v1 matrix

  - meta_name: Ubuntu
    meta_version: noble
    image: geerlingguy/docker-ubuntu2404-ansible
    full_support_ends: "2029-05-31"
    supported: true
    release_channel: lts
    runtime_distributions: [Ubuntu]
    runtime_release: "24.04"

  - meta_name: Ubuntu
    meta_version: resolute
    image: geerlingguy/docker-ubuntu2604-ansible
    full_support_ends: "2031-04-30"
    supported: false  # not yet adopted; no verified run

  - meta_name: Debian
    meta_version: bullseye
    image: geerlingguy/docker-debian11-ansible
    full_support_ends: "2024-08-14"
    supported: false  # LTS only since 2024-08-14

  - meta_name: Debian
    meta_version: bookworm
    image: geerlingguy/docker-debian12-ansible
    full_support_ends: "2026-07-11"
    supported: false  # LTS only since 2026-07-11

  - meta_name: Debian
    meta_version: trixie
    image: geerlingguy/docker-debian13-ansible
    full_support_ends: "2028-08-09"
    supported: false  # compatibility target; not in the stable v1 matrix

# PHP has no LTS designation. A branch is eligible only while php.net still
# supplies security fixes and the role's package sources can provide it. The
# stable Molecule matrix must use only branches enabled here.
# Dates checked 2026-09-06 against https://www.php.net/supported-versions.php.
php_versions:
  - version: "8.2"
    security_support_ends: "2026-12-31"
    supported: false  # upstream-supported, but not installable from Ubuntu 24.04 archives
  - version: "8.3"
    security_support_ends: "2027-12-31"
    supported: true
  - version: "8.4"
    security_support_ends: "2028-12-31"
    supported: false  # upstream-supported, but not installable from Ubuntu 24.04 archives
  - version: "8.5"
    security_support_ends: "2029-12-31"
    supported: false  # current upstream, but not yet proved by Molecule
