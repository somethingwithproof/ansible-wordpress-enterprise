---
- name: Verify the stable platform contract
  hosts: all
  gather_facts: true
  become: true

  vars:
    expected_web_service: "{{ 'nginx' if ansible_facts.os_family == 'Debian' else 'httpd' }}"
    expected_php_service: "{{ 'php' ~ wordpress_php_version ~ '-fpm' if ansible_facts.os_family == 'Debian' else 'php-fpm' }}"

  pre_tasks:
    - name: Read role defaults without replacing inventory overrides
      ansible.builtin.include_vars:
        file: ../../defaults/main.yml
        name: wordpress_role_defaults

    - name: Resolve logging defaults for the standalone verifier
      ansible.builtin.set_fact:
        wordpress_log_dir: "{{ wordpress_log_dir | default(wordpress_role_defaults.wordpress_log_dir) }}"
        wordpress_mysql_slow_query_log_file: >-
          {{ wordpress_mysql_slow_query_log_file |
             default(wordpress_role_defaults.wordpress_mysql_slow_query_log_file) }}

  tasks:
    - name: Collect service state
      ansible.builtin.service_facts:

    - name: Verify required services are running
      ansible.builtin.assert:
        that:
          - ansible_facts.services[expected_web_service ~ '.service'].state == 'running'
          - ansible_facts.services[expected_php_service ~ '.service'].state == 'running'
          - ansible_facts.services['mariadb.service'].state == 'running'
        fail_msg: Required WordPress services are not running

    - name: Validate web server configuration
      ansible.builtin.command:
        cmd: "{{ 'nginx -t' if wordpress_web_server == 'nginx' else 'apachectl configtest' }}"
      changed_when: false

    - name: Verify PHP is executable
      ansible.builtin.command:
        cmd: php --version
      register: php_version_output
      changed_when: false

    - name: Verify the requested PHP version is active
      ansible.builtin.assert:
        that:
          - "('PHP ' ~ wordpress_php_version ~ '.') in php_version_output.stdout"
        fail_msg: >-
          Requested PHP {{ wordpress_php_version }}, but the active runtime is
          {{ php_version_output.stdout_lines | first | default('unknown') }}

    - name: Inspect WordPress core files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ wordpress_install_dir }}/wp-config.php"
        - "{{ wordpress_install_dir }}/wp-settings.php"
        - "{{ wordpress_install_dir }}/wp-load.php"
        - "{{ wordpress_install_dir }}/index.php"
      register: wordpress_core_files

    - name: Verify WordPress core and wp-config permissions
      ansible.builtin.assert:
        that:
          - wordpress_core_files.results | map(attribute='stat.exists') | min
          - wordpress_core_files.results[0].stat.mode == '0600'
        fail_msg: WordPress core is incomplete or wp-config.php is not mode 0600

    - name: Verify the WordPress database is reachable
      ansible.builtin.command:
        argv:
          - mysql
          - "--user={{ wordpress_db_user }}"
          - "--password={{ wordpress_db_password }}"
          - "--host={{ wordpress_db_host }}"
          - "--execute=USE {{ wordpress_db_name }};"
      changed_when: false
      no_log: true

    - name: Inspect private service directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: >-
        {{ [wordpress_log_dir] +
           (['/var/log/nginx', '/var/cache/nginx', '/var/cache/nginx/fastcgi',
             '/var/cache/nginx/proxy', '/var/cache/nginx/scgi', '/var/cache/nginx/uwsgi']
            if wordpress_web_server == 'nginx'
            else [wordpress_log_dir ~ '/apache']) }}
      register: private_service_directories

    - name: Verify other users cannot inspect logs or caches
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - item.stat.mode == '0750'
        fail_msg: "Private service directory {{ item.item }} is not mode 0750"
      loop: "{{ private_service_directories.results }}"

    - name: Inspect the database slow query log
      ansible.builtin.stat:
        path: "{{ wordpress_mysql_slow_query_log_file }}"
      register: database_slow_log

    - name: Verify private database log ownership and permissions
      ansible.builtin.assert:
        that:
          - database_slow_log.stat.exists
          - database_slow_log.stat.mode == '0640'
          - database_slow_log.stat.pw_name == 'mysql'

    - name: Inspect logging after handlers have restarted the database
      ansible.mysql.mysql_query:
        query: "SHOW GLOBAL VARIABLES LIKE 'slow_query_log%'"
        login_user: root
        login_password: "{{ wordpress_db_root_password }}"
      register: verified_slow_settings
      changed_when: false
      no_log: true

    - name: Verify logging persists after service restarts
      ansible.builtin.assert:
        that:
          - slow_settings.slow_query_log == 'ON'
          - slow_settings.slow_query_log_file == wordpress_mysql_slow_query_log_file
      vars:
        slow_settings: >-
          {{ verified_slow_settings.query_result[0] |
             items2dict(key_name='Variable_name', value_name='Value') }}

    - name: Request WordPress through the configured virtual host
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ wordpress_server_name }}"
        status_code: 200
        return_content: true
      register: wordpress_http

    - name: Verify WordPress served dynamic content
      ansible.builtin.assert:
        that:
          - wordpress_http.content | length > 0
        fail_msg: WordPress returned an empty response

    - name: Find PHP files in uploads
      ansible.builtin.find:
        paths: "{{ wordpress_install_dir }}/wp-content/uploads"
        patterns: "*.php"
        file_type: file
      register: php_uploads

    - name: Verify uploads contain no PHP files
      ansible.builtin.assert:
        that:
          - php_uploads.matched == 0
        fail_msg: PHP files are present in the uploads directory
