---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    # raw needs no interpreter, so this has to run before any module does.
    # Rocky 8 ships Python 3.6 and ansible-core requires 3.9 or newer on a
    # managed node; python39 comes from appstream.
    - name: Ensure a supported Python is present
      ansible.builtin.raw: test -x /usr/bin/python3.9 || dnf -y install python39
      changed_when: false
      failed_when: false

    - name: Wait for system to be ready
      ansible.builtin.wait_for_connection:
        timeout: 60
