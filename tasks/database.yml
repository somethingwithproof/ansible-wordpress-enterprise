---
# Database Configuration Tasks

- name: Install MySQL/MariaDB server packages
  ansible.builtin.package:
    name: "{{ wordpress_db_packages[wordpress_db_engine] }}"
    state: present
    update_cache: "{{ wordpress_update_cache | bool }}"
  become: true
  when: not wordpress_use_external_db | bool
  notify: "Restart {{ wordpress_db_engine }}"

- name: Ensure database service is started and enabled
  ansible.builtin.service:
    name: "{{ wordpress_db_service[wordpress_db_engine] }}"
    state: started
    enabled: true
  become: true
  when: not wordpress_use_external_db | bool

- name: Set MySQL/MariaDB root password (first time)
  ansible.mysql.mysql_user:
    name: root
    password: "{{ wordpress_db_root_password }}"
    login_unix_socket: "{{ wordpress_db_socket }}"
    state: present
  become: true
  when:
    - not wordpress_use_external_db | bool
    - wordpress_db_root_password is defined
  register: mysql_root_password_set
  failed_when: false

- name: Create MySQL root configuration file
  ansible.builtin.template:
    src: mysql-root.cnf.j2
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: "0600"
  become: true
  when: not wordpress_use_external_db | bool

- name: Remove anonymous MySQL users
  ansible.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
  become: true
  when: not wordpress_use_external_db | bool

- name: Remove MySQL test database
  ansible.mysql.mysql_db:
    name: test
    state: absent
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
  become: true
  when: not wordpress_use_external_db | bool

- name: Remove remote root user access
  ansible.mysql.mysql_user:
    name: root
    host: "{{ item }}"
    state: absent
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
  become: true
  loop:
    - "{{ ansible_facts.hostname }}"
    - "127.0.0.1"
    - "::1"
    - "localhost.localdomain"
  when:
    - not wordpress_use_external_db | bool
    - item != "localhost"
  failed_when: false

- name: Create WordPress database
  ansible.mysql.mysql_db:
    name: "{{ wordpress_db_name }}"
    state: present
    encoding: "{{ wordpress_db_charset }}"
    collation: "{{ wordpress_db_collate }}"
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
  become: true

- name: Create WordPress database user
  ansible.mysql.mysql_user:
    name: "{{ wordpress_db_user }}"
    password: "{{ wordpress_db_password }}"
    priv: "{{ wordpress_db_name }}.*:ALL"
    host: "{{ wordpress_db_host if wordpress_use_external_db else 'localhost' }}"
    state: present
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
  become: true

- name: Configure MySQL/MariaDB for WordPress
  ansible.builtin.template:
    src: mysql-wordpress.cnf.j2
    dest: "{{ wordpress_db_config_dir[wordpress_db_engine] }}/wordpress.cnf"
    owner: root
    group: mysql
    mode: '0640'
    backup: true
  become: true
  when: not wordpress_use_external_db | bool
  notify: "Restart {{ wordpress_db_engine }}"

- name: Optimize MySQL/MariaDB configuration
  ansible.builtin.template:
    src: >-
      {{ 'mysql-optimization.cnf.j2' if wordpress_db_engine == 'mysql'
         else 'mariadb-optimization.cnf.j2' }}
    dest: "{{ wordpress_db_config_dir[wordpress_db_engine] }}/optimization.cnf"
    owner: root
    group: mysql
    mode: '0640'
    backup: true
  become: true
  when: not wordpress_use_external_db | bool
  notify: "Restart {{ wordpress_db_engine }}"

- name: Create database backup directory
  ansible.builtin.file:
    path: "{{ wordpress_backup_dir }}/database"
    state: directory
    owner: root
    group: root
    mode: "0750"
  become: true
  when: wordpress_enable_backups | bool

- name: Configure database log rotation
  ansible.builtin.template:
    src: mysql-logrotate.j2
    dest: /etc/logrotate.d/mysql-wordpress
    owner: root
    group: root
    mode: '0640'
  become: true
  when:
    - not wordpress_use_external_db | bool
    - wordpress_logrotate_enabled | bool

- name: Secure MySQL installation - reload privilege tables
  ansible.mysql.mysql_query:
    query: "FLUSH PRIVILEGES"
    login_user: root
    login_password: "{{ wordpress_db_root_password }}"
  become: true
  when: not wordpress_use_external_db | bool

- name: Test database connection
  ansible.mysql.mysql_query:
    query: "SELECT 1"
    login_host: "{{ wordpress_db_host }}"
    login_port: "{{ wordpress_db_port }}"
    login_user: "{{ wordpress_db_user }}"
    login_password: "{{ wordpress_db_password }}"
    login_db: "{{ wordpress_db_name }}"
  register: db_connection_test
  changed_when: false

- name: Display database connection status
  ansible.builtin.debug:
    msg: "Database connection successful"
  when: db_connection_test is succeeded

- name: Configure private local database logging
  become: true
  when:
    - not wordpress_use_external_db | bool
    - wordpress_enable_logging | bool
  block:
    - name: Validate slow query log configuration
      ansible.builtin.assert:
        that:
          - wordpress_mysql_slow_query_log_file is match('^/[A-Za-z0-9_./-]+$')
          - "'..' not in wordpress_mysql_slow_query_log_file.split('/')"
          - wordpress_mysql_long_query_time | float >= 0
        fail_msg: Slow query logging requires a safe absolute path and nonnegative threshold

    - name: Create private slow query log directory
      ansible.builtin.file:
        path: "{{ wordpress_mysql_slow_query_log_file | dirname }}"
        state: directory
        owner: mysql
        group: mysql
        mode: '0750'

    - name: Initialize the slow query log without resetting timestamps
      ansible.builtin.file:
        path: "{{ wordpress_mysql_slow_query_log_file }}"
        state: touch
        access_time: preserve
        modification_time: preserve
        owner: mysql
        group: mysql
        mode: '0640'

    - name: Persist slow query logging across database restarts
      ansible.builtin.copy:
        content: |
          [mysqld]
          slow_query_log=1
          slow_query_log_file={{ wordpress_mysql_slow_query_log_file }}
          long_query_time={{ wordpress_mysql_long_query_time }}
        dest: "{{ wordpress_db_config_dir[wordpress_db_engine] }}/wordpress-logging.cnf"
        owner: root
        group: mysql
        mode: '0640'
      notify: "Restart {{ wordpress_db_engine }}"

    - name: Inspect active slow query settings
      ansible.mysql.mysql_query:
        query: >-
          SHOW GLOBAL VARIABLES WHERE Variable_name IN
          ('slow_query_log', 'slow_query_log_file', 'long_query_time')
        login_user: root
        login_password: "{{ wordpress_db_root_password }}"
      register: wordpress_active_slow_query_settings
      changed_when: false
      no_log: true

    - name: Enable slow query logging only when settings differ
      ansible.mysql.mysql_query:
        query:
          - "SET GLOBAL slow_query_log_file = '{{ wordpress_mysql_slow_query_log_file }}'"
          - "SET GLOBAL long_query_time = {{ wordpress_mysql_long_query_time }}"
          - "SET GLOBAL slow_query_log = 'ON'"
        login_user: root
        login_password: "{{ wordpress_db_root_password }}"
      vars:
        active_slow_settings: >-
          {{ wordpress_active_slow_query_settings.query_result[0] |
             items2dict(key_name='Variable_name', value_name='Value') }}
      when: >-
        active_slow_settings.slow_query_log != 'ON' or
        active_slow_settings.slow_query_log_file != wordpress_mysql_slow_query_log_file or
        active_slow_settings.long_query_time | float != wordpress_mysql_long_query_time | float
      changed_when: true
      no_log: true

- name: Configure external database SSL (if enabled)
  when:
    - wordpress_use_external_db | bool
    - wordpress_external_db_ssl_enabled | bool
  block:
    - name: Create SSL certificate directory
      ansible.builtin.file:
        path: /etc/mysql/ssl
        state: directory
        owner: mysql
        group: mysql
        mode: "0750"
      become: true

    - name: Copy database SSL certificates
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: mysql
        group: mysql
        mode: "0640"
      become: true
      loop:
        - { src: "{{ wordpress_external_db_ssl_ca }}", dest: "/etc/mysql/ssl/ca.pem" }
        - { src: "{{ wordpress_external_db_ssl_cert }}", dest: "/etc/mysql/ssl/client-cert.pem" }
        - { src: "{{ wordpress_external_db_ssl_key }}", dest: "/etc/mysql/ssl/client-key.pem" }
      when:
        - item.src != ""
        - item.src is defined
