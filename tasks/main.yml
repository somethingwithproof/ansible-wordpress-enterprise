---
# Main tasks file for ansible-wordpress-enterprise

- name: Enforce the managed-node release policy
  ansible.builtin.include_tasks:
    file: platform_policy.yml
    apply:
      tags: [always]
  tags: [always]

- name: Load operating system variables
  ansible.builtin.include_vars: "{{ ansible_facts.os_family }}.yml"
  tags: [always]

# The generated defaults use lookup('password', '/dev/null ...), which returns
# a new value on every evaluation because nothing is persisted. Referencing one
# twice yields two different secrets: the database password that gets set is not
# the one written to wp-config.php. Resolve each once here and reuse the result.
- name: Resolve generated credentials once for this run
  ansible.builtin.set_fact:
    wordpress_db_root_password: "{{ wordpress_db_root_password }}"
    wordpress_db_password: "{{ wordpress_db_password }}"
    wordpress_admin_password: "{{ wordpress_admin_password }}"
    wordpress_auth_key: "{{ wordpress_auth_key }}"
    wordpress_secure_auth_key: "{{ wordpress_secure_auth_key }}"
    wordpress_logged_in_key: "{{ wordpress_logged_in_key }}"
    wordpress_nonce_key: "{{ wordpress_nonce_key }}"
    wordpress_auth_salt: "{{ wordpress_auth_salt }}"
    wordpress_secure_auth_salt: "{{ wordpress_secure_auth_salt }}"
    wordpress_logged_in_salt: "{{ wordpress_logged_in_salt }}"
    wordpress_nonce_salt: "{{ wordpress_nonce_salt }}"
  no_log: true
  tags: [always]

# Keep the role's public variable contract, but execute it through explicit,
# ordered phases. A phase owns the state it creates; later phases may consume
# that state but must not recreate or reset it.
- name: Phase 1 | Validate inputs and platform
  ansible.builtin.include_tasks: validate.yml
  tags: [always, validate]

- name: Phase 2 | Prepare users and packages
  ansible.builtin.include_tasks: prerequisites.yml
  tags: [always, prerequisites]

- name: Phase 3 | Configure database
  ansible.builtin.include_tasks: database.yml
  when: not wordpress_use_external_db | default(false) | bool
  tags: [database]

- name: Phase 4 | Configure PHP runtime
  ansible.builtin.include_tasks: php.yml
  tags: [php]

- name: Phase 4 | Prepare and validate the TLS certificate
  ansible.builtin.include_tasks:
    file: ssl_certificate.yml
    apply:
      tags: [ssl, security, webserver, nginx, apache]
  when: wordpress_enable_ssl | bool
  tags: [ssl, security, webserver, nginx, apache]

- name: Phase 5 | Configure Apache
  ansible.builtin.include_tasks: webserver_apache.yml
  when: wordpress_web_server == "apache"
  tags: [webserver, apache]

- name: Phase 5 | Configure Nginx
  ansible.builtin.include_tasks: webserver_nginx.yml
  when: wordpress_web_server == "nginx"
  tags: [webserver, nginx]

- name: Phase 6 | Install WordPress
  ansible.builtin.include_tasks: wordpress_install.yml
  tags: [wordpress]

- name: Phase 6 | Configure WordPress
  ansible.builtin.include_tasks: wordpress_configure.yml
  tags: [wordpress, configure]

- name: Phase 7 | Configure TLS
  ansible.builtin.include_tasks: ssl.yml
  when: wordpress_enable_ssl | default(false) | bool
  tags: [ssl, security]

- name: Phase 7 | Configure caching
  ansible.builtin.include_tasks: caching.yml
  when: wordpress_enable_caching | default(false) | bool
  tags: [caching, performance]

- name: Phase 7 | Configure application security
  ansible.builtin.include_tasks: security.yml
  when: wordpress_enable_security | default(false) | bool
  tags: [security]

- name: Phase 7 | Configure firewall
  ansible.builtin.include_tasks: firewall.yml
  when: wordpress_configure_firewall | default(false) | bool
  tags: [firewall, security]

- name: Phase 7 | Configure fail2ban
  ansible.builtin.include_tasks: fail2ban.yml
  when: wordpress_enable_fail2ban | default(false) | bool
  tags: [fail2ban, security]

- name: Phase 7 | Harden the operating system
  ansible.builtin.include_tasks: security_hardening.yml
  when: wordpress_security_hardening_enabled | default(true) | bool
  tags: [security, hardening, selinux, apparmor]

- name: Phase 8 | Configure monitoring
  ansible.builtin.include_tasks: monitoring.yml
  when: wordpress_enable_monitoring | default(false) | bool
  tags: [monitoring]

- name: Phase 8 | Configure backups
  ansible.builtin.include_tasks: backups.yml
  when: wordpress_enable_backups | default(false) | bool
  tags: [backups]

- name: Phase 9 | Finalize file ownership and permissions
  ansible.builtin.include_tasks: finalize.yml
  tags: [wordpress, security, finalize]

- name: Phase 9 | Verify deployment
  ansible.builtin.include_tasks: verify.yml
  tags: [verify]
