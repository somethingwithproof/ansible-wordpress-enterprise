---
# Prerequisites tasks for WordPress installation

- name: Update package cache (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"

- name: Update package cache (RedHat/CentOS)
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_facts.os_family == "RedHat"

- name: Install basic packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - unzip
      - git
      - python3-apt
      - ca-certificates
      - gnupg
      - lsb-release
      - cron
    state: present
  when: ansible_facts.os_family == "Debian"

- name: Install basic packages (RedHat/CentOS)
  ansible.builtin.dnf:
    name:
      - curl
      - wget
      - unzip
      - git
      - ca-certificates
      - gnupg2
      - cronie
    state: present
    allowerasing: true
  when: ansible_facts.os_family == "RedHat"

- name: Create WordPress system group
  ansible.builtin.group:
    name: "{{ wordpress_system_group | default('www-data') }}"
    system: true
    state: present

- name: Create WordPress system user
  ansible.builtin.user:
    name: "{{ wordpress_system_user | default('www-data') }}"
    group: "{{ wordpress_system_group | default('www-data') }}"
    system: true
    shell: /bin/false
    home: /var/www
    createhome: true
    state: present

- name: Create WordPress directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ wordpress_system_user | default('www-data') }}"
    group: "{{ wordpress_system_group | default('www-data') }}"
    mode: '0755'
  loop:
    - "{{ wordpress_install_dir }}"
    - "{{ wordpress_install_dir }}/wp-content"
    - "{{ wordpress_install_dir }}/wp-content/uploads"
    - "{{ wordpress_install_dir }}/wp-content/themes"
    - "{{ wordpress_install_dir }}/wp-content/plugins"
    - /var/log/wordpress

# wordpress_enable_ssl defaults true while no certificate source does, so the
# web server config would reference a file that never exists and fail its own
# config test. Emit the TLS blocks only once a certificate is actually there.
- name: Check whether the configured TLS certificate exists
  ansible.builtin.stat:
    path: "{{ wordpress_ssl_certificate }}"
  register: wordpress_ssl_certificate_stat

- name: Record whether TLS can be served
  ansible.builtin.set_fact:
    wordpress_ssl_ready: "{{ (wordpress_enable_ssl | bool) and wordpress_ssl_certificate_stat.stat.exists }}"
