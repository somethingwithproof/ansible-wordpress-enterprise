---
- name: Configure standalone certificate renewal with service recovery
  ansible.builtin.cron:
    name: "Renew Let's Encrypt certificates"
    minute: "0"
    hour: "12"
    user: root
    state: present
    job: >-
      /usr/bin/certbot renew --quiet --cert-name {{ wordpress_server_name | quote }}
      --pre-hook {{ ('systemctl stop ' ~ wordpress_web_server_service[wordpress_web_server]) | quote }}
      --post-hook {{ ('systemctl start ' ~ wordpress_web_server_service[wordpress_web_server]) | quote }}
  become: true
  when: wordpress_use_letsencrypt | bool

- name: Install the Apache TLS module on Enterprise Linux
  ansible.builtin.package:
    name: mod_ssl
    state: present
  become: true
  when:
    - wordpress_web_server == "apache"
    - ansible_facts.os_family == "RedHat"
  notify: Restart apache

- name: Enable the Apache TLS module on Debian
  ansible.builtin.command:
    argv: [a2enmod, ssl]
  become: true
  when:
    - wordpress_web_server == "apache"
    - ansible_facts.os_family == "Debian"
  register: wordpress_enable_ssl_module
  changed_when: "'already enabled' not in wordpress_enable_ssl_module.stdout"
  notify: Restart apache

- name: Configure Apache TLS session settings
  ansible.builtin.template:
    src: apache-ssl.conf.j2
    dest: >-
      {{ wordpress_apache_conf_path }}/{{
      'conf-available/ssl-' ~ wordpress_server_name ~ '.conf'
      if ansible_facts.os_family == 'Debian'
      else 'conf.d/ssl.conf' }}
    owner: root
    group: root
    mode: '0640'
  become: true
  when: wordpress_web_server == "apache"
  notify: Reload apache

- name: Install the TLS security policy
  ansible.builtin.template:
    src: ssl-security.conf.j2
    dest: >-
      {{ '/etc/nginx/conf.d/ssl-security-params.conf'
      if wordpress_web_server == 'nginx'
      else wordpress_apache_conf_path ~ '/conf-available/ssl-params.conf'
      if ansible_facts.os_family == 'Debian'
      else wordpress_apache_conf_path ~ '/conf.d/ssl-params.conf' }}
    owner: root
    group: root
    mode: '0640'
  become: true
  notify: "Reload {{ wordpress_web_server }}"

- name: Enable the Apache TLS configuration on Debian
  ansible.builtin.command:
    argv: [a2enconf, "{{ item }}"]
  loop:
    - "ssl-{{ wordpress_server_name }}"
    - ssl-params
  become: true
  when:
    - wordpress_web_server == "apache"
    - ansible_facts.os_family == "Debian"
  register: wordpress_enable_tls_configuration
  changed_when: "'already enabled' not in wordpress_enable_tls_configuration.stdout"
  notify: Reload apache

- name: Validate the complete TLS web server configuration
  ansible.builtin.command:
    argv: "{{ ['nginx', '-t'] if wordpress_web_server == 'nginx' else ['apachectl', 'configtest'] }}"
  changed_when: false
  become: true
  check_mode: false

- name: Activate validated TLS configuration before probing it
  ansible.builtin.meta: flush_handlers

- name: Install certificate expiration monitoring
  ansible.builtin.template:
    src: ssl-monitor.sh.j2
    dest: /usr/local/bin/ssl-monitor.sh
    owner: root
    group: root
    mode: '0750'
  become: true

- name: Schedule certificate expiration monitoring
  ansible.builtin.cron:
    name: "Monitor SSL certificate expiration"
    minute: "0"
    hour: "6"
    user: root
    state: present
    job: /usr/local/bin/ssl-monitor.sh
  become: true

- name: Verify SSL configuration
  ansible.builtin.uri:
    url: "https://{{ wordpress_server_name }}:{{ wordpress_https_port }}"
    method: HEAD
    status_code: [200, 301, 302]
    validate_certs: true
    ca_path: >-
      {{ wordpress_ssl_ca_path | default(
           wordpress_ssl_certificate if wordpress_enable_ssl | bool
           and wordpress_generate_self_signed_cert | bool
           and not wordpress_use_letsencrypt | bool else omit, true) }}
    use_proxy: false
  register: ssl_verification
  when: wordpress_enable_ssl | bool
  become: true
