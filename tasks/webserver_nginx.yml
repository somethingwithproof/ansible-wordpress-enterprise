---
- name: Install Nginx
  ansible.builtin.package:
    name: nginx
    state: present
  become: true

- name: Create Nginx sites directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/nginx/sites-available
    - /etc/nginx/sites-enabled
    - /etc/nginx/conf.d
    - /etc/nginx/snippets
  become: true

- name: Configure Nginx for WordPress
  ansible.builtin.template:
    src: nginx-wordpress.conf.j2
    dest: "/etc/nginx/sites-available/wordpress"
    owner: root
    group: root
    mode: '0640'
  become: true
  notify: Reload nginx

- name: Enable WordPress site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/wordpress
    dest: /etc/nginx/sites-enabled/wordpress
    state: link
  become: true
  notify: Reload nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/sites-available/default
  become: true
  notify: Reload nginx

- name: Configure Nginx main settings
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0640'
    backup: true
  become: true
  notify: Reload nginx

- name: Create Nginx cache directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ wordpress_system_user }}"
    group: "{{ wordpress_system_group }}"
    mode: '0750'
  become: true
  loop:
    - /var/cache/nginx
    - /var/cache/nginx/wordpress
  when: wordpress_enable_nginx_cache | default(true)

- name: Create additional Nginx directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: '0750'
  loop:
    - {path: /var/log/nginx, owner: "{{ wordpress_system_user }}", group: "{{ wordpress_system_group }}"}
    - {path: /var/cache/nginx/fastcgi, owner: "{{ wordpress_system_user }}", group: "{{ wordpress_system_group }}"}
    - {path: /var/cache/nginx/proxy, owner: "{{ wordpress_system_user }}", group: "{{ wordpress_system_group }}"}
    - {path: /var/cache/nginx/scgi, owner: "{{ wordpress_system_user }}", group: "{{ wordpress_system_group }}"}
    - {path: /var/cache/nginx/uwsgi, owner: "{{ wordpress_system_user }}", group: "{{ wordpress_system_group }}"}
  loop_control:
    label: "{{ item.path }}"
  become: true

- name: Configure Nginx security settings
  ansible.builtin.template:
    src: nginx-security.conf.j2
    dest: /etc/nginx/conf.d/security.conf
    owner: root
    group: root
    mode: '0640'
    backup: true
  become: true
  notify: Reload nginx

- name: Configure Nginx performance settings
  ansible.builtin.template:
    src: nginx-performance.conf.j2
    dest: /etc/nginx/conf.d/performance.conf
    owner: root
    group: root
    mode: '0640'
    backup: true
  become: true
  notify: Reload nginx

- name: Configure Nginx SSL settings
  ansible.builtin.template:
    src: nginx-ssl.conf.j2
    dest: /etc/nginx/conf.d/ssl.conf
    owner: root
    group: root
    mode: '0640'
    backup: true
  become: true
  when: wordpress_enable_ssl | default(true)
  notify: Reload nginx

- name: Configure Nginx caching settings
  ansible.builtin.template:
    src: nginx-cache.conf.j2
    dest: /etc/nginx/conf.d/cache.conf
    owner: root
    group: root
    mode: '0640'
    backup: true
  become: true
  when: wordpress_enable_nginx_cache | default(true)
  notify: Reload nginx

- name: Configure Nginx rate limiting
  ansible.builtin.template:
    src: nginx-ratelimit.conf.j2
    dest: /etc/nginx/conf.d/ratelimit.conf
    owner: root
    group: root
    mode: '0640'
    backup: true
  become: true
  when: wordpress_nginx_rate_limiting | default(true)
  notify: Reload nginx

- name: Configure Nginx gzip compression
  ansible.builtin.template:
    src: nginx-gzip.conf.j2
    dest: /etc/nginx/conf.d/gzip.conf
    owner: root
    group: root
    mode: '0640'
    backup: true
  become: true
  notify: Reload nginx

- name: Set proper permissions for cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ wordpress_system_user }}"
    group: "{{ wordpress_system_group }}"
    mode: '0750'
  loop:
    - /var/cache/nginx
    - /var/log/nginx
  become: true
  when: wordpress_enable_nginx_cache | default(true)

- name: Configure log rotation for Nginx
  ansible.builtin.template:
    src: nginx-logrotate.j2
    dest: /etc/logrotate.d/nginx-wordpress
    owner: root
    group: root
    mode: '0640'
  become: true
  when: wordpress_logrotate_enabled | default(true)

- name: Create Nginx monitoring configuration
  ansible.builtin.template:
    src: nginx-status.conf.j2
    dest: /etc/nginx/conf.d/status.conf
    owner: root
    group: root
    mode: '0640'
  become: true
  when: wordpress_nginx_status_page | default(false)
  notify: Reload nginx

- name: Test Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  become: true
  register: nginx_test
  changed_when: false
  check_mode: false

- name: Enable and start Nginx service
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Verify Nginx is responding
  ansible.builtin.uri:
    url: "http://localhost/"
    ca_path: >-
      {{ wordpress_ssl_ca_path | default(
           wordpress_ssl_certificate if wordpress_enable_ssl | bool
           and wordpress_generate_self_signed_cert | bool
           and not wordpress_use_letsencrypt | bool else omit, true) }}
    method: HEAD
    status_code: [200, 301, 302, 403, 404]
  register: nginx_response
  retries: 3
  delay: 5
  ignore_errors: true

- name: Display Nginx status
  ansible.builtin.debug:
    msg: "Nginx is {{ 'responding' if nginx_response is succeeded else 'not responding' }}"
  when: wordpress_debug | default(false)
